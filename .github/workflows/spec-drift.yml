name: spec drift

# Regenerate the candidate OpenAPI spec from the developer.samsclub.com docs on a
# schedule. If the docs drifted, open a PR with the candidate diff. The PR is the
# human review gate: a reviewer ports real changes into the hand-authored
# canonical spec, which is never overwritten automatically. The candidate is
# never shipped and never loaded at runtime.
#
# Sam's Club only. Every other bundled spec comes from the ReadMe api-registry,
# where `refresh_specs` and scripts/fetch_specs.py fetch the document directly —
# there is nothing to scrape and nothing to review.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Regenerate candidate spec from docs
        run: uv run --group spec-build python scripts/build_samsclub_spec.py

      - name: Open PR on drift
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: spec-candidates/samsclub/ads/sponsored-products.openapi.json
          branch: spec-drift/candidate
          delete-branch: true
          labels: spec-drift
          title: "chore(spec): docs drift in Sam's Club Ads candidate spec"
          commit-message: |
            chore(spec): regenerate candidate spec from docs

            Auto-generated by scripts/build_samsclub_spec.py from
            developer.samsclub.com. Review the diff and port real changes into
            the hand-authored
            src/mcp_walmart_ads/specs/samsclub/ads/sponsored-products.openapi.json.

            Assisted-by: Claude:claude-opus-5
          body: |
            The scheduled scraper detected changes in the developer.samsclub.com docs.

            **This candidate is not shipped and not loaded at runtime** — it exists
            only to surface documentation drift (added/removed/renamed endpoints,
            parameters, and body fields).

            ### Review checklist
            - [ ] Inspect the diff to
                  `spec-candidates/samsclub/ads/sponsored-products.openapi.json`.
            - [ ] Port any real changes into the hand-authored
                  `src/mcp_walmart_ads/specs/samsclub/ads/sponsored-products.openapi.json`
                  (keep its curated `$ref`s, enums, and formats).
            - [ ] Update the counts in `tests/test_specs.py` if the canonical spec changed.
